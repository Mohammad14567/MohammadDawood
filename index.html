<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MohammadDawood | Terminal Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0a0e1a;
    --bg2:      #0d1221;
    --surface:  #111827;
    --border:   #1e2d45;
    --dim:      #263352;
    --text:     #c9d1e8;
    --muted:    #4a5a7a;
    --accent:   #38bdf8;
    --green:    #4ade80;
    --yellow:   #facc15;
    --red:      #f87171;
    --purple:   #a78bfa;
    --orange:   #fb923c;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
  }

  #root { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 3px; }

  /* ── Cursor blink ── */
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  .cursor { display:inline-block; width:8px; height:1em; background:var(--accent); margin-left:2px; vertical-align:middle; animation:blink 1s step-end infinite; }

  /* ── Glitch keyframes ── */
  @keyframes glitch1 {
    0%{clip-path:inset(20% 0 60% 0); transform:translate(-3px,0)}
    50%{clip-path:inset(40% 0 40% 0); transform:translate(3px,0)}
    100%{clip-path:inset(60% 0 20% 0); transform:translate(0,0)}
  }
  @keyframes glitch2 {
    0%{clip-path:inset(60% 0 10% 0); transform:translate(3px,0)}
    50%{clip-path:inset(10% 0 70% 0); transform:translate(-3px,0)}
    100%{clip-path:inset(30% 0 50% 0); transform:translate(0,0)}
  }
  @keyframes scanline {
    0%{top:0} 100%{top:100%}
  }

  /* ── Entry screen ── */
  .entry-screen {
    position:fixed; inset:0; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:100; transition:opacity .6s ease, transform .6s ease;
  }
  .entry-screen.fade-out { opacity:0; transform:scale(1.04); pointer-events:none; }

  .ascii-banner {
    color: var(--accent);
    font-size: clamp(9px, 1.5vw, 13px);
    line-height: 1.2;
    white-space: pre;
    text-align: center;
    text-shadow: 0 0 20px rgba(56,189,248,.5);
    margin-bottom: 32px;
  }

  .entry-box {
    width: min(600px, 90vw);
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(56,189,248,.08), 0 20px 60px rgba(0,0,0,.6);
  }
  .entry-titlebar {
    background: var(--bg2);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .dot { width:12px; height:12px; border-radius:50%; }
  .dot-r{background:#f87171;} .dot-y{background:#facc15;} .dot-g{background:#4ade80;}
  .titlebar-label { flex:1; text-align:center; color:var(--muted); font-size:12px; }

  .entry-body { padding: 20px 24px 24px; }
  .entry-prompt-line { display:flex; align-items:center; gap:8px; margin-top:12px; }
  .prompt-sym { color: var(--green); }
  .entry-input {
    flex:1; background:transparent; border:none; outline:none;
    color:var(--text); font-family:inherit; font-size:14px; caret-color: var(--accent);
  }
  .entry-hint { color:var(--muted); font-size:12px; margin-bottom:4px; }

  .scanline-overlay {
    position:fixed; inset:0; pointer-events:none; z-index:9999;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 3px,
      rgba(0,0,0,.06) 3px, rgba(0,0,0,.06) 4px
    );
  }

  /* ── Main terminal ── */
  .terminal-card {
    width: 100%;
    max-width: 900px;
    height: 80vh;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .terminal-wrapper {
    flex:1; display:flex; flex-direction:column;
    overflow:hidden;
    opacity:0; transition:opacity .5s ease .1s;
  }
  .terminal-wrapper.visible { opacity:1; }

  /* Top bar */
  .top-bar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    height: 40px;
    flex-shrink: 0;
  }
  .top-bar-dots { display:flex; gap:6px; }
  .top-bar-title { color:var(--muted); font-size:12px; flex:1; text-align:center; letter-spacing:.05em; }
  .top-bar-status { font-size:11px; color:var(--green); }

  /* Output area */
  .output-area {
    flex:1; overflow-y:auto; padding:20px 24px;
    scroll-behavior: smooth;
  }

  /* Input row */
  .input-row {
    border-top: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg2);
    flex-shrink: 0;
  }
  .ps1 { color:var(--green); white-space:nowrap; }
  .ps1 span.at { color:var(--muted); }
  .ps1 span.host { color:var(--purple); }
  .ps1 span.path { color:var(--accent); }
  .cmd-input {
    flex:1; background:transparent; border:none; outline:none;
    color:var(--text); font-family:inherit; font-size:14px;
    caret-color: var(--accent);
  }

  /* Output lines */
  .line { margin-bottom: 2px; }
  .line.cmd { color: var(--text); }
  .line.cmd::before { content:'❯ '; color:var(--green); }
  .line.out { color: var(--text); padding-left:2px; }
  .line.comment { color: var(--muted); }
  .line.error { color: var(--red); }
  .line.success { color: var(--green); }
  .line.info { color: var(--accent); }
  .line.warn { color: var(--yellow); }
  .line.blank { height:10px; }

  /* Highlights */
  .hl-cyan  { color: var(--accent); }
  .hl-green { color: var(--green); }
  .hl-yellow{ color: var(--yellow); }
  .hl-purple{ color: var(--purple); }
  .hl-orange{ color: var(--orange); }
  .hl-muted { color: var(--muted); }
  .hl-bold  { font-weight:700; }

  /* Badge */
  .badge {
    display:inline-block; padding:0 8px; border-radius:2px;
    font-size:11px; font-weight:600; letter-spacing:.04em;
  }
  .badge-green  { background:rgba(74,222,128,.15); color:var(--green); border:1px solid rgba(74,222,128,.3); }
  .badge-blue   { background:rgba(56,189,248,.12); color:var(--accent); border:1px solid rgba(56,189,248,.25); }
  .badge-purple { background:rgba(167,139,250,.12); color:var(--purple); border:1px solid rgba(167,139,250,.25); }
  .badge-orange { background:rgba(251,146,60,.12); color:var(--orange); border:1px solid rgba(251,146,60,.25); }

  /* Progress bar */
  .prog-row { display:flex; align-items:center; gap:12px; margin:3px 0; }
  .prog-label { width:140px; color:var(--text); font-size:13px; }
  .prog-bar-bg { flex:1; height:8px; background:var(--dim); border-radius:1px; overflow:hidden; }
  .prog-bar-fill { height:100%; border-radius:1px; transition:width 1s ease; }
  .prog-pct { width:36px; text-align:right; color:var(--muted); font-size:12px; }

  /* Project card */
  .project-card {
    border: 1px solid var(--border);
    border-radius:4px;
    padding:14px 18px;
    margin: 6px 0;
    background:var(--surface);
    transition: border-color .2s;
  }
  .project-card:hover { border-color: var(--accent); }
  .project-name { color:var(--accent); font-weight:700; font-size:15px; }
  .project-desc { color:var(--text); margin:4px 0; font-size:13px; }
  .project-tags { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  .project-link { color:var(--muted); font-size:12px; }
  .project-link a { color:var(--green); text-decoration:none; }
  .project-link a:hover { text-decoration:underline; }

  /* Typing animation */
  @keyframes fadeInLine { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
  .anim-line { animation: fadeInLine .2s ease forwards; }

  /* Glitch text */
  .glitch-wrap { position:relative; display:inline-block; }
  .glitch-wrap::before,
  .glitch-wrap::after {
    content: attr(data-text);
    position:absolute; inset:0;
    color:var(--accent);
  }
  .glitch-wrap::before { animation: glitch1 .4s infinite; color:var(--red); opacity:.6; }
  .glitch-wrap::after  { animation: glitch2 .4s infinite; color:var(--green); opacity:.6; }

  /* Help table */
  .help-row { display:grid; grid-template-columns:140px 1fr; gap:4px; padding:2px 0; }
  .help-cmd { color:var(--yellow); }
  .help-desc { color:var(--muted); }

  /* Responsive */
  @media(max-width:600px){
    .output-area { padding:14px 14px; font-size:13px; }
    .input-row { padding:10px 14px; font-size:13px; }
    .ascii-banner { font-size:7px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<div class="scanline-overlay"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ─── ASCII Banner ─────────────────────────────────────────── */
const BANNER = `
 ███╗   ███╗ ██████╗ ██╗  ██╗ █████╗ ███╗   ███╗███╗   ███╗ █████╗ ██████╗ 
 ████╗ ████║██╔═══██╗██║  ██║██╔══██╗████╗ ████║████╗ ████║██╔══██╗██╔══██╗
 ██╔████╔██║██║   ██║███████║███████║██╔████╔██║██╔████╔██║███████║██║  ██║
 ██║╚██╔╝██║██║   ██║██╔══██║██╔══██║██║╚██╔╝██║██║╚██╔╝██║██╔══██║██║  ██║
 ██║ ╚═╝ ██║╚██████╔╝██║  ██║██║  ██║██║ ╚═╝ ██║██║ ╚═╝ ██║██║  ██║██████╔╝
 ╚═╝     ╚═╝ ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝     ╚═╝╚═╝     ╚═╝╚═╝  ╚═╝╚═════╝ 
                   ██████╗  █████╗ ██╗    ██╗ ██████╗  ██████╗ ██████╗       
                   ██╔══██╗██╔══██╗██║    ██║██╔═══██╗██╔═══██╗██╔══██╗      
                   ██║  ██║███████║██║ █╗ ██║██║   ██║██║   ██║██║  ██║      
                   ██║  ██║██╔══██║██║███╗██║██║   ██║██║   ██║██║  ██║      
                   ██████╔╝██║  ██║╚███╔███╔╝╚██████╔╝╚██████╔╝██████╔╝      
                   ╚═════╝ ╚═╝  ╚═╝ ╚══╝╚══╝  ╚═════╝  ╚═════╝ ╚═════╝      
`.trim();

/* ─── Data ──────────────────────────────────────────────────── */
const SKILLS = [];

const PROJECTS = [];

/* ─── Output line helpers ───────────────────────────────────── */
let _key = 0;
const key = () => ++_key;

const L = (type, content) => ({ id: key(), type, content });
const blank = () => L('blank','');
const cmd   = c => L('cmd', c);
const out   = c => L('out', c);
const comment= c => L('comment', c);
const err   = c => L('error', c);
const succ  = c => L('success', c);
const info  = c => L('info', c);
const warn  = c => L('warn', c);

/* ─── JSX helpers ───────────────────────────────────────────── */
const Cx = ({c,cl}) => <span className={cl}>{c}</span>;
const cyan   = s => <span className="hl-cyan">{s}</span>;
const green  = s => <span className="hl-green">{s}</span>;
const yellow = s => <span className="hl-yellow">{s}</span>;
const purple = s => <span className="hl-purple">{s}</span>;
const orange = s => <span className="hl-orange">{s}</span>;
const muted  = s => <span className="hl-muted">{s}</span>;
const bold   = s => <span className="hl-bold">{s}</span>;
const Badge  = ({c,color='blue'}) => <span className={`badge badge-${color}`}>{c}</span>;

/* ─── ProgressBar ───────────────────────────────────────────── */
function ProgBar({name, pct, color, delay}) {
  const [w, setW] = useState(0);
  useEffect(()=>{ const t=setTimeout(()=>setW(pct), delay||0); return()=>clearTimeout(t); },[]);
  return (
    <div className="prog-row">
      <div className="prog-label">{name}</div>
      <div className="prog-bar-bg">
        <div className="prog-bar-fill" style={{width:`${w}%`, background:color}}/>
      </div>
      <div className="prog-pct">{pct}%</div>
    </div>
  );
}

/* ─── Output renderer ───────────────────────────────────────── */
function OutLine({line}) {
  if(line.type==='blank') return <div className="line blank"/>;
  if(typeof line.content === 'string') {
    return <div className={`line ${line.type} anim-line`}>{line.content}</div>;
  }
  return <div className={`line ${line.type} anim-line`}>{line.content}</div>;
}

/* ─── Command responses ─────────────────────────────────────── */
function buildHelp() {
  return [
    blank(),
    L('out',<>{cyan('Available commands:')}</>),
    blank(),
    L('out',<div className="help-row"><span className="help-cmd">help</span><span className="help-desc">Show this help message</span></div>),
    L('out',<div className="help-row"><span className="help-cmd">whoami</span><span className="help-desc">Display developer profile</span></div>),
    L('out',<div className="help-row"><span className="help-cmd">skills</span><span className="help-desc">List all skills with proficiency</span></div>),
    L('out',<div className="help-row"><span className="help-cmd">skills --list</span><span className="help-desc">Quick skills overview</span></div>),
    L('out',<div className="help-row"><span className="help-cmd">projects --show</span><span className="help-desc">Display all projects</span></div>),
    L('out',<div className="help-row"><span className="help-cmd">open &lt;id&gt;</span><span className="help-desc">Open a project by id (e.g. open smartgrid)</span></div>),
    L('out',<div className="help-row"><span className="help-cmd">contact</span><span className="help-desc">Show contact information</span></div>),
    L('out',<div className="help-row"><span className="help-cmd">clear</span><span className="help-desc">Clear the terminal</span></div>),
    blank(),
  ];
}

function buildWhoami() {
  return [
    blank(),
    L('comment','# ── Developer Profile ─────────────────────────────────'),
    blank(),
    L('out',<>{muted('$')} {cyan('name')}        {muted(':')} {bold('MohammadDawood')}</>),
    L('out',<>{muted('$')} {cyan('role')}        {muted(':')} {green('Frontend Developer')} {muted('/')} {purple('Full Stack Developer')}</>),
    L('out',<>{muted('$')} {cyan('status')}      {muted(':')} Building smart systems {yellow('⚡')}</>),
    L('out',<>{muted('$')} {cyan('location')}    {muted(':')} {orange('🌍')} Remote / Global</>),
    L('out',<>{muted('$')} {cyan('experience')}  {muted(':')} {yellow('3+')} years of crafting web systems</>),
    L('out',<>{muted('$')} {cyan('focus')}       {muted(':')} React, Node.js, IoT, Clean Architecture</>),
    L('out',<>{muted('$')} {cyan('available')}   {muted(':')} <Badge c="Open to Work" color="green"/></>),
    blank(),
    L('comment','# ─────────────────────────────────────────────────────'),
    blank(),
  ];
}

function buildSkills(mode) {
  if(mode==='list') {
    return [
      blank(),
      L('out',<>{cyan('$ skills --list')}</>),
      blank(),
      L('out',<>
        <Badge c="React" color="blue"/> {'  '}
        <Badge c="Node.js" color="green"/> {'  '}
        <Badge c="JavaScript" color="orange"/> {'  '}
        <Badge c="TypeScript" color="purple"/> {'  '}
        <Badge c="CSS/Tailwind" color="blue"/>
      </>),
      L('out',<>
        <Badge c="IoT" color="green"/> {'  '}
        <Badge c="REST APIs" color="orange"/> {'  '}
        <Badge c="GraphQL" color="purple"/> {'  '}
        <Badge c="Problem Solving" color="green"/>
      </>),
      blank(),
    ];
  }
  return [
    blank(),
    L('comment','# ── Skills & Proficiency ──────────────────────────────'),
    blank(),
    ...SKILLS.map((s,i)=>L('out',<ProgBar key={s.name} name={s.name} pct={s.pct} color={s.color} delay={i*80}/>)),
    blank(),
    L('comment','# ─────────────────────────────────────────────────────'),
    blank(),
  ];
}

function buildProjects() {
  return [
    blank(),
    L('comment','# ── Projects ──────────────────────────────────────────'),
    blank(),
    L('out',<>{muted('Found')} {yellow(PROJECTS.length)} {muted('projects ↓')}</>),
    blank(),
    ...PROJECTS.map(p => L('out',
      <div className="project-card">
        <div className="project-name">{p.id}/</div>
        <div className="project-name" style={{fontSize:'16px',marginTop:2}}>{p.name}</div>
        <div className="project-desc">{p.desc}</div>
        <div className="project-tags">
          {p.tags.map(t=><Badge key={t} c={t} color="blue"/>)}
        </div>
        <div className="project-link">📂 path: {muted(p.path)}</div>
        <div className="project-link">🔗 repo: <a href={p.link} target="_blank" rel="noopener noreferrer">{p.link}</a></div>
      </div>
    )),
    blank(),
    L('comment','# ─────────────────────────────────────────────────────'),
    blank(),
  ];
}

function buildOpen(id) {
  const p = PROJECTS.find(x=>x.id===id.toLowerCase());
  if(!p) return [blank(), err(`project "${id}" not found. Run 'projects --show' to list all.`), blank()];
  return [
    blank(),
    L('comment',`# Opening ${p.name}...`),
    blank(),
    L('out',<div className="project-card" style={{borderColor:'var(--accent)'}}>
      <div className="project-name" style={{fontSize:'17px'}}>{p.name}</div>
      <div className="project-desc" style={{marginTop:6}}>{p.desc}</div>
      <div className="project-tags" style={{margin:'8px 0'}}>
        {p.tags.map(t=><Badge key={t} c={t} color="blue"/>)}
      </div>
      <div className="project-link" style={{marginTop:4}}>📂 {muted(p.path)}</div>
      <div className="project-link">🔗 <a href={p.link} target="_blank" rel="noopener noreferrer">{p.link}</a></div>
    </div>),
    blank(),
    succ(`Launching ${p.id}... opening repository in new tab.`),
    blank(),
  ];
}

function buildContact() {
  return [
    blank(),
    L('comment','# ── Contact ───────────────────────────────────────────'),
    blank(),
    L('out',<>{muted('📧')} email    {muted(':')} {cyan('mohammaddawood.dev@gmail.com')}</>),
    L('out',<>{muted('🐙')} github   {muted(':')} <a href="https://github.com/MohammadDawood" target="_blank" rel="noopener noreferrer" style={{color:'var(--green)'}}>github.com/MohammadDawood</a></>),
    L('out',<>{muted('💼')} linkedin {muted(':')} <a href="https://linkedin.com/in/mohammaddawood" target="_blank" rel="noopener noreferrer" style={{color:'var(--accent)'}}>linkedin.com/in/mohammaddawood</a></>),
    L('out',<>{muted('🌐')} website  {muted(':')} {purple('mohammaddawood.dev')}</>),
    blank(),
    L('comment','# ─────────────────────────────────────────────────────'),
    blank(),
  ];
}

/* ─── Boot sequence ─────────────────────────────────────────── */
const BOOT = [
  L('comment','  '),
  L('comment','# MohammadDawood Terminal Portfolio v2.0.1'),
  L('comment','# ─────────────────────────────────────────────────────────────────'),
  blank(),
  info('Initializing developer profile...'),
  info('Loading runtime modules...'),
  info('Mounting file system...'),
  succ('All systems operational.'),
  blank(),
  L('out',<>{muted('$')} {cyan('name')}    {muted(':')} {bold('MohammadDawood')}</>),
  L('out',<>{muted('$')} {cyan('role')}    {muted(':')} {green('Frontend Developer')} {muted('/')} {purple('Full Stack Developer')}</>),
  L('out',<>{muted('$')} {cyan('status')}  {muted(':')} Building smart systems {yellow('⚡')}</>),
  blank(),
  L('comment','# Type  help  to see available commands.'),
  blank(),
];

/* ─── Main Terminal ─────────────────────────────────────────── */
function Terminal() {
  const [lines, setLines] = useState([]);
  const [input, setInput] = useState('');
  const [history, setHistory] = useState([]);
  const [histIdx, setHistIdx] = useState(-1);
  const endRef = useRef(null);
  const inputRef = useRef(null);

  const push = useCallback((newLines) => {
    setLines(prev => [...prev, ...newLines]);
  }, []);

  useEffect(()=>{
    let i=0;
    const reveal = () => {
      if(i < BOOT.length) { push([BOOT[i++]]); setTimeout(reveal, i<8?120:20); }
    };
    reveal();
  },[]);

  useEffect(()=>{
    endRef.current?.scrollIntoView({behavior:'smooth'});
  },[lines]);

  const handleCmd = (raw) => {
    const trimmed = raw.trim();
    if(!trimmed) return;

    const newHist = [trimmed, ...history].slice(0,50);
    setHistory(newHist);
    setHistIdx(-1);

    const newLines = [cmd(trimmed)];

    const lower = trimmed.toLowerCase();

    if(lower==='help') {
      push([...newLines, ...buildHelp()]);
    } else if(lower==='whoami' || lower==='about') {
      push([...newLines, ...buildWhoami()]);
    } else if(lower==='skills' || lower==='skills --bars') {
      push([...newLines, ...buildSkills('bars')]);
    } else if(lower==='skills --list') {
      push([...newLines, ...buildSkills('list')]);
    } else if(lower==='projects --show' || lower==='projects') {
      push([...newLines, ...buildProjects()]);
    } else if(lower.startsWith('open ')) {
      const id = trimmed.slice(5).trim();
      const p = PROJECTS.find(x=>x.id===id.toLowerCase());
      const res = buildOpen(id);
      push([...newLines, ...res]);
      if(p) setTimeout(()=>window.open(p.link,'_blank'),400);
    } else if(lower==='contact') {
      push([...newLines, ...buildContact()]);
    } else if(lower==='clear') {
      setLines([]);
    } else if(lower==='exit' || lower==='quit') {
      push([...newLines, blank(), warn('Session cannot be terminated from this interface.'), blank()]);
    } else if(lower==='ls') {
      push([...newLines, blank(),
        L('out',<>{cyan('skills/')}{'   '}{green('projects/')}{'   '}{purple('contact/')}{'   '}{yellow('about.md')}</>),
        blank()]);
    } else {
      push([...newLines, blank(),
        L('error', `zsh: command not found: ${trimmed}`),
        L('comment','# Type  help  to see available commands.'),
        blank()]);
    }
  };

  const onKey = (e) => {
    if(e.key==='Enter') {
      handleCmd(input);
      setInput('');
    } else if(e.key==='ArrowUp') {
      e.preventDefault();
      const idx = Math.min(histIdx+1, history.length-1);
      setHistIdx(idx);
      setInput(history[idx]||'');
    } else if(e.key==='ArrowDown') {
      e.preventDefault();
      const idx = Math.max(histIdx-1,-1);
      setHistIdx(idx);
      setInput(idx===-1?'':history[idx]||'');
    } else if(e.key==='Tab') {
      e.preventDefault();
      const cmds=['help','whoami','skills','skills --list','skills --bars','projects --show','contact','clear','open '];
      const match=cmds.find(c=>c.startsWith(input));
      if(match) setInput(match);
    }
  };

  return (
    <div className="terminal-wrapper visible" onClick={()=>inputRef.current?.focus()}>
      {/* Top bar */}
      <div className="top-bar">
        <div className="top-bar-dots">
          <div className="dot dot-r"/><div className="dot dot-y"/><div className="dot dot-g"/>
        </div>
        <div className="top-bar-title">MohammadDawood@portfolio ~ zsh</div>
        <div className="top-bar-status">● connected</div>
      </div>

      {/* Output */}
      <div className="output-area">
        {lines.map(l=><OutLine key={l.id} line={l}/>)}
        <div ref={endRef}/>
      </div>

      {/* Input */}
      <div className="input-row">
        <span className="ps1">
          <span className="hl-green">dawood</span>
          <span className="at">@</span>
          <span className="host">portfolio</span>
          <span className="hl-muted">:</span>
          <span className="path">~</span>
          <span className="hl-muted"> $</span>
        </span>
        <input
          ref={inputRef}
          className="cmd-input"
          value={input}
          onChange={e=>setInput(e.target.value)}
          onKeyDown={onKey}
          autoFocus
          spellCheck={false}
          autoComplete="off"
          aria-label="Terminal input"
        />
        <span className="cursor"/>
      </div>
    </div>
  );
}

/* ─── Entry screen ──────────────────────────────────────────── */
function EntryScreen({onEnter}) {
  const [input, setInput]       = useState('');
  const [fading, setFading]     = useState(false);
  const [errMsg, setErrMsg]     = useState('');
  const [typed, setTyped]       = useState('');
  const inputRef = useRef(null);

  const INTRO = 'Type  yes  to initialize session...';
  useEffect(()=>{
    let i=0;
    const t=setInterval(()=>{
      if(i<=INTRO.length){ setTyped(INTRO.slice(0,i)); i++; }
      else clearInterval(t);
    },35);
    return ()=>clearInterval(t);
  },[]);

  const submit = () => {
    if(input.trim().toLowerCase()==='yes'){
      setFading(true);
      setTimeout(onEnter,650);
    } else {
      setErrMsg(`zsh: command not found: ${input.trim()||'(empty)'}`);
      setInput('');
      setTimeout(()=>setErrMsg(''),2500);
    }
  };

  return (
    <div className={`entry-screen${fading?' fade-out':''}`} onClick={()=>inputRef.current?.focus()}>
      <div className="ascii-banner">{BANNER}</div>
      <div className="entry-box">
        <div className="entry-titlebar">
          <div className="dot dot-r"/><div className="dot dot-y"/><div className="dot dot-g"/>
          <div className="titlebar-label">terminal — zsh — 80×24</div>
        </div>
        <div className="entry-body">
          <div className="entry-hint">{typed}<span className="cursor"/></div>
          {errMsg && <div style={{color:'var(--red)',fontSize:'13px',marginBottom:4}}>{errMsg}</div>}
          <div className="entry-prompt-line">
            <span className="prompt-sym">❯</span>
            <input
              ref={inputRef}
              className="entry-input"
              value={input}
              onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&submit()}
              autoFocus
              spellCheck={false}
              autoComplete="off"
              placeholder=""
            />
            {!input && <span className="cursor"/>}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─── App ───────────────────────────────────────────────────── */
function App() {
  const [entered, setEntered] = useState(false);
  if (!entered) return <EntryScreen onEnter={()=>setEntered(true)}/>;
  return <div className="terminal-card"><Terminal/></div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
